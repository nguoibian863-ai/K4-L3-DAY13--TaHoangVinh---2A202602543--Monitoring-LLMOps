alerts:
  - name: High user-visible latency
    severity: critical
    condition: latency_p95_ms > 3000
    duration: 5m
    type: symptom-based
    channel: "#llmops-alerts"
    owner: on-call-platform
    runbook: docs/alerts.md#high-user-visible-latency
  - name: Elevated request failures
    severity: critical
    condition: error_rate_pct > 2
    duration: 5m
    type: symptom-based
    channel: "#llmops-alerts"
    owner: on-call-platform
    runbook: docs/alerts.md#elevated-request-failures
  - name: Degraded answer quality
    severity: warning
    condition: quality_score_mean < 0.75
    duration: 10m
    type: symptom-based
    channel: "#llmops-alerts"
    owner: llm-quality
    runbook: docs/alerts.md#degraded-answer-quality
